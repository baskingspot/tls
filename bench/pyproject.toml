[project]
name = "tls-bench"
version = "0.0.0"
description = "tls benchmark workloads for the baskingspot EC2 harness."
requires-python = ">=3.15"
dependencies = [
  "ec2bench @ git+https://github.com/baskingspot/infra@cff88dc4c6f30a2ee314c60f55f49675bb4557f3#subdirectory=harness",
]

[project.scripts]
bench = "ec2bench.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "ty==0.0.91"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tls_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "PIE",
  "PT",
  "RUF",
  "S",
  "PTH",
  "RET",
  "ARG",
  "PERF",
  "FURB",
  "BLE",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"tls_bench/*" = ["S603"]

[tool.ty.environment]
python-version = "3.15"
