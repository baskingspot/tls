name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version without the leading v, such as 0.1.0
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: baskingspot/gh-actions/.github/workflows/release-library.yml@4ccb53b # v0.12.0
    with:
      version: ${{ inputs.version }}
