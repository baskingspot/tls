name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version without the leading v, such as 0.1.0
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: baskingspot/gh-actions/.github/workflows/release-library.yml@a26279caa6babcb0b548e6c55ced2aac9ee9a5b9 # v0.12.1
    with:
      version: ${{ inputs.version }}
