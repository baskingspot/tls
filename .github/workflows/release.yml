name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version without the leading v, such as 0.1.0
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: baskingspot/gh-actions/.github/workflows/release-library.yml@60fdcb91fc57fb01c356b0b1634e1324755df887 # v0.10.0
    with:
      version: ${{ inputs.version }}
