name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version without the leading v, such as 0.1.0
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: baskingspot/gh-actions/.github/workflows/release-library.yml@bf313f8558e63403ef5e1e148b488f84757e0e70 # v0.11.0
    with:
      version: ${{ inputs.version }}
