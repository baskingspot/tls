# The full gate runs on the default shell, the current stable Zig. The
# compatibility lane has to compile and pass the suite on the previous one.
jobs:
  - recipe: ci
  - recipe: check
    shell: zig-old
  - recipe: check-backend-boringssl
    # The BoringSSL suite needs the devshell that links BoringSSL.
    shell: boringssl
  # kqueue coverage. Five defects in integrations/tls-xev have been invisible
  # under io_uring and every one was found because a human ran a Mac by hand;
  # the 21/21 that closed #76 was stale within a day. Scoped to the integration
  # packages and the distribution smoke gate rather than the whole lane:
  # conformance needs a Python/TLS-Anvil stack that has never been exercised
  # on macOS.
  #
  # The three integrations that build on both Zig versions run on the default
  # shell. libxev pins a commit that only builds on 0.16, so its integration
  # and the distribution smoke (which tests the minimum supported Zig by
  # design) stay in `zig-old`.
  - recipe: integrations-ci
    runners: [ubuntu-26.04, macos-26]
  - recipe: integrations-xev-ci
    shell: zig-old
    runners: [ubuntu-26.04, macos-26]
  - recipe: distribution-ci
    shell: zig-old
    runners: [ubuntu-26.04, macos-26]
