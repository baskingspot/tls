jobs:
  - recipe: ci
  - recipe: check-backend-boringssl
    # The BoringSSL suite needs the devshell that links BoringSSL.
    shell: boringssl
  # kqueue coverage. Five defects in integrations/tls-xev have been invisible
  # under io_uring and every one was found because a human ran a Mac by hand;
  # the 21/21 that closed #76 was stale within a day. Scoped to the integration
  # packages and the distribution smoke gate rather than the whole lane:
  # conformance needs a Python/TLS-Anvil stack that has never been exercised
  # on macOS.
  - recipe: integrations-ci
    runners: [macos-26]
  - recipe: distribution-ci
    runners: [macos-26]
