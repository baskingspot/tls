# The full gate runs on the default shell, the current stable Zig. The
# compatibility lane has to compile and pass the suite on the previous one.
jobs:
  - recipe: ci
  - recipe: check
    shell: zig-old
  - recipe: check-backend-boringssl
    # The BoringSSL suite needs the devshell that links BoringSSL.
    shell: boringssl
  # macOS coverage for the transport-facing packages. The engine is
  # platform-neutral, but every integration here drives a real socket, and the
  # readiness backends differ in ways Linux never shows. Scoped to the
  # integration packages and the distribution smoke gate rather than the whole
  # lane: conformance needs a Python/TLS-Anvil stack that has never been
  # exercised on macOS.
  - recipe: integrations-ci
    runners: [ubuntu-26.04, macos-26]

  # The distribution smoke tests the minimum supported Zig by design, so it
  # runs on the older toolchain.
  - recipe: distribution-ci
    shell: zig-old
    runners: [ubuntu-26.04, macos-26]
